[package]
name = "memocap"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "SQLite memory CLI shared by Codex, Claude Code, Pi, and OpenCode"
license = "MIT"
repository = "https://github.com/luodaoyi/memocap"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "6.0"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
ureq = { version = "2.12", features = ["json"] }

[dev-dependencies]
tempfile = "3.15"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[workspace]
resolver = "2"
